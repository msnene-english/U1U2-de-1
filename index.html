    <script>

            {

            {

            {

            {

        let studentName = '';
        const totalQuestions = testData.length;
        let answeredQuestions = new Set();

        function startTest() {
            const nameInput = document.getElementById('studentName').value.trim();
            if (!nameInput) {
                alert("Vui lòng nhập họ và tên trước khi bắt đầu bài thi!");
                return;
            }
            studentName = nameInput;
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('testScreen').classList.add('active');
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            
            // Render section 1
            html += '<div class="section-title"><h3>I. Multiple Choice Questions (MCQs) - 25 câu</h3></div>';
            
            testData.forEach((q, index) => {
                if (index === 25) {
                    html += '<div class="section-title"><h3>II. Gap-fill (Điền từ vào chỗ trống) - 25 câu</h3></div>';
                }

                html += `<div class="question-block" id="qblock-${q.id}">`;
                if (q.type === 'mcq') {
                    html += `<div class="question-text">${q.question}</div><div class="options">`;
                    q.options.forEach((opt, i) => {
                        html += `
                            <label id="label-${q.id}-${i}">
                                <input type="radio" name="q${q.id}" value="${i}" onchange="updateProgress(${q.id})"> 
                                ${opt.text}
                            </label>
                        `;
                    });
                    html += `</div>`;
                } else {
                    const qText = q.question.replace('_____', `<input type="text" class="gap-fill-input" name="q${q.id}" oninput="updateProgress(${q.id})" autocomplete="off">`);
                    html += `<div class="question-text">${qText}</div>`;
                }
                html += `<div class="explanation" id="exp-${q.id}">${q.explanation}</div>`;
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function updateProgress(id) {
            answeredQuestions.add(id);
            const progress = (answeredQuestions.size / totalQuestions) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function submitTest() {
            if (answeredQuestions.size < totalQuestions) {
                const confirmSubmit = confirm(`Bạn mới làm ${answeredQuestions.size}/${totalQuestions} câu. Bạn có chắc chắn muốn nộp bài?`);
                if (!confirmSubmit) return;
            }

            let score = 0;
            let errors = [];

            testData.forEach(q => {
                let isCorrect = false;
                let userAnswer = '';
                let correctAnswerText = '';

                if (q.type === 'mcq') {
                    const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                    correctAnswerText = q.options.find(o => o.isCorrect).text.charAt(0);
                    
                    if (selected) {
                        const val = parseInt(selected.value);
                        userAnswer = q.options[val].text.charAt(0);
                        if (q.options[val].isCorrect) {
                            isCorrect = true;
                            score++;
                        }
                    } else {
                        userAnswer = 'Chưa làm';
                    }

                    // Highlight answers
                    q.options.forEach((opt, i) => {
                        const label = document.getElementById(`label-${q.id}-${i}`);
                        const radio = document.querySelector(`input[name="q${q.id}"][value="${i}"]`);
                        radio.disabled = true;
                        if (opt.isCorrect) {
                            label.classList.add('correct-opt');
                        } else if (selected && parseInt(selected.value) === i) {
                            label.classList.add('wrong-opt');
                        }
                    });

                } else {
                    const input = document.querySelector(`input[name="q${q.id}"]`);
                    userAnswer = input.value.trim();
                    input.disabled = true;
                    const cleanUser = userAnswer.toLowerCase().replace(/\s+/g, ' ');
                    
                    correctAnswerText = q.correctAnswer.join(" / ");
                    
                    if (q.correctAnswer.some(ans => ans.toLowerCase() === cleanUser)) {
                        isCorrect = true;
                        score++;
                        input.classList.add('correct-opt');
                    } else {
                        input.classList.add('wrong-opt');
                    }
                }

                if (!isCorrect) {
                    errors.push(`Câu ${q.id}: Học sinh chọn/điền "${userAnswer}" (sai), đáp án đúng là "${correctAnswerText}"`);
                }

                // Show explanation
                document.getElementById(`exp-${q.id}`).style.display = 'block';
            });

            // Send to Google Forms
            sendToGoogleForms(score, errors);

            // UI changes
            document.getElementById('testScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');
            document.getElementById('scoreDisplay').innerText = `Điểm của bạn: ${score} / ${totalQuestions}`;
            
            // Move test container into review
            document.getElementById('reviewContainer').appendChild(document.getElementById('questionsContainer'));
            document.querySelector('.progress-container').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function sendToGoogleForms(score, errors) {
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse';
            
            const formData = new URLSearchParams();
            formData.append('entry.1861648410', studentName);
            formData.append('entry.1691800437', score);
            formData.append('entry.639295732', errors.join('\n'));
            formData.append('entry.370465671', 'U1-U2 Đề 1');

            fetch(formUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            }).then(() => {
                console.log('Đã nộp bài thành công');
            }).catch(e => {
                console.error('Lỗi khi nộp bài: ', e);
            });
        }
    </script>
